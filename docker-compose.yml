name: airbnb-clone

services:
  # MySQL 8.4 LTS. Data lives in the mysql-data volume (survives `docker compose down`,
  # wiped by `docker compose down -v`). init/ creates the airbnb_clone_testing DB for phpunit.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: airbnb_clone
      MYSQL_USER: airbnb
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 3307 on the host so it doesn't clash with a local MySQL/XAMPP on 3306
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Laravel API (PHP-FPM). Runs composer install and creates .env on first start.
  backend:
    build:
      context: ./docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: airbnb-clone/backend:dev
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    # Healthy once composer install has finished (first start can take a few minutes)
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
      start_interval: 3s

  # Web server in front of PHP-FPM -> http://localhost:8000
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # React + Vite dev server with hot reload -> http://localhost:5173
  # node_modules lives in a named volume: packages installed on a Windows/macOS host
  # contain native binaries (esbuild, rollup) that don't run inside Linux.
  frontend:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "[ -f .env ] || cp .env.example .env; npm install && npm run dev"
    environment:
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    # Healthy once npm install has finished and Vite is serving
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 3s

  # Database browser -> http://localhost:8080
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

  # Catches every email Laravel sends -> http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  mysql-data:
  frontend-node-modules:
