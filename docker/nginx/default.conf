server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Property photo uploads
    client_max_body_size 20M;

    # Resolve the backend container through Docker's DNS on every request (cached 10s),
    # so recreating the backend container doesn't leave nginx pointing at a stale IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream backend:9000;

    # Public uploads (storage/app/public). Served directly instead of via the
    # `php artisan storage:link` symlink, which breaks on Windows bind mounts.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
